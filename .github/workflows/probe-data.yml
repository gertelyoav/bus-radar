name: Probe bus data

# Manual helper: fetches a live sample from the Open Bus Stride API so we can see the
# real fields and the actual delay. Run it from the Actions tab ("Run workflow").
on:
  workflow_dispatch:
    inputs:
      lat:
        description: Centre latitude
        default: "32.0853"
      lon:
        description: Centre longitude
        default: "34.7818"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Query API
        env:
          LAT: ${{ inputs.lat }}
          LON: ${{ inputs.lon }}
        run: |
          set -e
          API=https://open-bus-stride-api.hasadna.org.il
          echo "== siri_vehicle_locations/list parameters =="
          curl -sS "$API/openapi.json" | jq -r '.paths["/siri_vehicle_locations/list"].get.parameters[].name' | tr '\n' ' '; echo
          echo "== response schema fields =="
          curl -sS "$API/openapi.json" | jq -r '.components.schemas | to_entries[] | select(.key|test("SiriVehicleLocation")) | .key + ": " + (.value.properties|keys|join(", "))'
          FROM=$(date -u -d '-10 min' +%Y-%m-%dT%H:%M:%SZ)
          TO=$(date -u -d '+1 min' +%Y-%m-%dT%H:%M:%SZ)
          D=0.009
          MINLAT=$(echo "$LAT - $D" | bc); MAXLAT=$(echo "$LAT + $D" | bc)
          MINLON=$(echo "$LON - 0.011" | bc); MAXLON=$(echo "$LON + 0.011" | bc)
          URL="$API/siri_vehicle_locations/list?limit=500&order_by=recorded_at_time%20desc&recorded_at_time_from=$FROM&recorded_at_time_to=$TO&lat__greater_or_equal=$MINLAT&lat__lower_or_equal=$MAXLAT&lon__greater_or_equal=$MINLON&lon__lower_or_equal=$MAXLON"
          echo "== request =="; echo "$URL"
          START=$(date +%s%N)
          curl -sS --max-time 60 "$URL" -o sample.json
          END=$(date +%s%N)
          echo "== response time: $(( (END-START)/1000000 )) ms, now: $(date -u +%FT%TZ) =="
          if ! jq -e 'type=="array"' sample.json >/dev/null; then echo "unexpected response:"; cat sample.json; exit 1; fi
          echo "count: $(jq length sample.json)"
          echo "distinct vehicles: $(jq '[.[].siri_ride__vehicle_ref]|unique|length' sample.json)"
          echo "newest recorded_at_time: $(jq -r '.[0].recorded_at_time' sample.json)"
          echo "oldest recorded_at_time: $(jq -r '.[-1].recorded_at_time' sample.json)"
          echo "newest snapshot: $(jq -r '.[0].siri_snapshot__snapshot_id' sample.json)"
          echo "== first 2 records =="
          jq '.[0:2]' sample.json
          LINE_REF=$(jq -r '.[0].siri_route__line_ref' sample.json)
          OP_REF=$(jq -r '.[0].siri_route__operator_ref' sample.json)
          TODAY=$(date -u +%F)
          echo "== gtfs_routes for line_ref $LINE_REF operator $OP_REF =="
          curl -sS --max-time 60 "$API/gtfs_routes/list?line_refs=$LINE_REF&date_from=$TODAY&date_to=$TODAY&limit=3" | jq '.'
          REFS=$(jq -r '[.[].siri_route__line_ref]|unique|.[0:5]|join(",")' sample.json)
          echo "== gtfs_routes for several line_refs at once: $REFS =="
          curl -sS --max-time 60 "$API/gtfs_routes/list?line_refs=$REFS&date_from=$TODAY&date_to=$TODAY&limit=20" | jq -c '.[] | {line_ref, route_short_name, agency_name}'
          echo "== all API paths =="
          curl -sS "$API/openapi.json" | jq -r '.paths | keys[]' | tr '\n' ' '; echo
          for P in gtfs_rides gtfs_ride_stops gtfs_stops; do
            echo "== $P/list parameters =="
            curl -sS "$API/openapi.json" | jq -r --arg p "/$P/list" '.paths[$p].get.parameters[].name' | tr '\n' ' '; echo
          done
          ROUTE_ID=$(curl -sS --max-time 60 "$API/gtfs_routes/list?line_refs=$LINE_REF&date_from=$TODAY&date_to=$TODAY&limit=1" | jq -r '.[0].id')
          MKT=$(curl -sS --max-time 60 "$API/gtfs_routes/list?line_refs=$LINE_REF&date_from=$TODAY&date_to=$TODAY&limit=1" | jq -r '.[0].route_mkt')
          echo "== routes sharing route_mkt $MKT today =="
          curl -sS --max-time 60 "$API/gtfs_routes/list?route_mkt=$MKT&date_from=$TODAY&date_to=$TODAY&limit=20" | jq -c '.[] | {id, line_ref, route_short_name, route_direction, route_alternative, route_long_name}'
          echo "== one gtfs_ride for route id $ROUTE_ID =="
          curl -sS --max-time 60 "$API/gtfs_rides/list?gtfs_route_id=$ROUTE_ID&limit=1" | tee ride.json | jq '.'
          RIDE_ID=$(jq -r '.[0].id' ride.json)
          echo "== ride stops for ride $RIDE_ID (first 3, count) =="
          curl -sS --max-time 60 "$API/gtfs_ride_stops/list?gtfs_ride_ids=$RIDE_ID&limit=500" | tee stops.json | jq '.[0:3]'
          echo "stop count: $(jq length stops.json)"
          echo "== live buses on line_ref $LINE_REF anywhere, last 5 min =="
          F5=$(date -u -d '-5 min' +%Y-%m-%dT%H:%M:%SZ)
          curl -sS --max-time 60 "$API/siri_vehicle_locations/list?siri_routes__line_ref=$LINE_REF&recorded_at_time_from=$F5&recorded_at_time_to=$TO&limit=500&order_by=recorded_at_time%20desc" | jq '[.[].siri_ride__vehicle_ref]|unique|length'
          echo "== gtfs_routes by line_ref, no date filter =="
          curl -sS --max-time 60 "$API/gtfs_routes/list?line_refs=$LINE_REF&limit=2&order_by=date%20desc" | jq '.'
          echo "== latest siri snapshots =="
          curl -sS --max-time 60 "$API/siri_snapshots/list?limit=3&order_by=id%20desc" | jq -c '.[] | {snapshot_id, etl_status, etl_end_time}' || true
          echo "== gtfs_routes/list parameters =="
          curl -sS "$API/openapi.json" | jq -r '.paths["/gtfs_routes/list"].get.parameters[].name' | tr '\n' ' '; echo
