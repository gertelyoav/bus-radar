name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bus-radar-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # On main, replace the "latest" pre-release so the newest APK is always at
      # https://github.com/<owner>/bus-radar/releases/tag/latest (easy to open on the phone).
      - name: Publish latest APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk bus-radar.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest bus-radar.apk \
            --prerelease \
            --title "Latest build" \
            --notes "Built automatically from ${GITHUB_SHA::7}. Download bus-radar.apk on your phone and install it." \
            --target "$GITHUB_SHA"
